name: Employee Medallion ETL Pipeline CI & Packaging

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodları GitHub sunucusuna çek
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Python ortamını kur
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Bağımlılıkları yükle (PySpark, nbconvert vb.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyspark nbconvert pytest

    # 4. TESTING: Notebook dosyalarının varlığını ve yapısını kontrol et
    - name: Validate Medallion Notebooks
      run: |
        echo "=== Testing Notebook files ==="
        test -f 01-Bronze-Emp.ipynb && echo "Bronze Notebook OK"
        test -f 02-Silver-Emp.ipynb && echo "Silver Notebook OK"
        test -f 03-Gold-Emp.ipynb && echo "Gold Notebook OK"

    # 5. PACKAGING: Medallion ETL dosyalarını dağıtım paketi (Artifact) haline getir
    - name: Create Pipeline Deployment Artifact
      uses: actions/upload-artifact@v4
      with:
        name: employee-etl-package
        path: |
          01-Bronze-Emp.ipynb
          02-Silver-Emp.ipynb
          03-Gold-Emp.ipynb
          README.md
