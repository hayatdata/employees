name: Employee Medallion ETL Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. CI STEP: TEST & PACKAGE
  # ==========================================
  ci-build-test-package:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyspark nbconvert pytest

    - name: Validate Medallion Notebooks
      run: |
        echo "=== Testing Notebook files ==="
        test -f 01-Bronze-Emp.ipynb && echo "Bronze Notebook OK"
        test -f 02-Silver-Emp.ipynb && echo "Silver Notebook OK"
        test -f 03-Gold-Emp.ipynb && echo "Gold Notebook OK"

    - name: Create Pipeline Deployment Artifact
      uses: actions/upload-artifact@v4
      with:
        name: employee-etl-package
        path: |
          01-Bronze-Emp.ipynb
          02-Silver-Emp.ipynb
          03-Gold-Emp.ipynb
          README.md

  # ==========================================
  # 2. CD STEP: DEPLOY TO STAGING
  # ==========================================
  cd-deploy-to-staging:
    needs: ci-build-test-package
    runs-on: ubuntu-latest

    steps:
    - name: Download ETL Package
      uses: actions/download-artifact@v4
      with:
        name: employee-etl-package

    - name: Deploy to Staging Environment
      run: |
        echo "=== Deploying Employee ETL Pipeline to Staging Environment ==="
        ls -la
        echo "Successfully deployed Bronze, Silver, Gold pipelines to STAGING!"

  # ==========================================
  # 3. CD STEP: DEPLOY TO PRODUCTION
  # ==========================================
  cd-deploy-to-production:
    needs: cd-deploy-to-staging
    runs-on: ubuntu-latest

    steps:
    - name: Download ETL Package
      uses: actions/download-artifact@v4
      with:
        name: employee-etl-package

    - name: Deploy to Production Environment
      run: |
        echo "=== Deploying Employee ETL Pipeline to PRODUCTION ==="
        ls -la
        echo "Successfully deployed Bronze, Silver, Gold pipelines to PRODUCTION!"
