name: Employee Data Pipeline CI

# Bu workflow ne zaman çalışacak?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodları GitHub sunucusuna çek
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Python ortamını kur
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Gerekli kütüphaneleri yükle (PySpark vb.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyspark nbconvert

    # 4. Projedeki dosyaları ve yapıyı kontrol et
    - name: Run basic sanity check
      run: |
        echo "Checking repository structure..."
        ls -la
        echo "CI Pipeline executed successfully!"
